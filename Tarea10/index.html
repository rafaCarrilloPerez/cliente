<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Login con Promesas</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-5">
        <h2 class="mb-4">Iniciar sesión</h2>






        <div id="alertas"></div>






        <!-- Formulario -->






        <form class="justify-context-center" id="loginForm" style="max-width: 600px; ">

            <div class="alert alert-info alert-dismissible fade show" role="alert">
                <strong>credenciales de prueba</strong><br>
                Email: test@medac.es<br>
                Contraseña: 1234


            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="email@ejemplo.com">
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" placeholder="Contraseña">
            </div>

            <button type="submit" class="btn btn-primary">Iniciar sesión</button>
        </form>

        <!-- carg -->




        <div id="spinner" class="mt-3 d-none">
            <div class="spinner-border text-primary" role="status"></div>
            <span class="ms-2">Validando credenciales...</span>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const alertas = document.getElementById('alertas');
        const spinner = document.getElementById('spinner');

        form.addEventListener('submit', function (e) {
            e.preventDefault();

            alertas.innerHTML = '';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (email === '' || password === '') {
                mostrarAlerta('Todos los campos son obligatorios', 'danger');
                return;
            }

            spinner.classList.remove('d-none');

            login(email, password)
                .then(() => {
                    mostrarAlerta('Login correcto. Bienvenido.', 'success');
                })
                .catch(() => {
                    mostrarAlerta('Credenciales incorrectas.', 'danger');
                })
                .finally(() => {
                    spinner.classList.add('d-none');
                });
        });

        function login(email, password) {
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    if (email === 'test@medac.es' && password === '1234') {
                        resolve();
                    } else {
                        reject();
                    }
                }, 1500);
            });
        }

        function mostrarAlerta(mensaje, tipo) {
            alertas.innerHTML = `
      <div class="alert alert-${tipo}" role="alert">
        ${mensaje}
      </div>
    `;
        }
    </script>

</body>

</html>
